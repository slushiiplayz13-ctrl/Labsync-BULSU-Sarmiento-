<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Room Assignments Print Preview</title>
  <link rel="icon" href="/assets/LabSync (Logo Only).png" type="image/png">
  <!-- Google Fonts for Actions panel styling to keep it looking premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- html2pdf for direct PDF download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style id="auth-anti-flash">body { display: none !important; }</style>
  <script src="js/auth-check.js"></script>
  <style>
    /* Simulated Folio Page for Screen Preview */
    body {
        font-family: Arial, sans-serif;
        background-color: #f1f5f9;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .print-actions {
        width: 8.27in;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        background: #ffffff;
        padding: 14px 28px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    .actions-left h1 {
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
        margin: 0;
    }
    .actions-left p {
        font-size: 12px;
        color: #64748b;
        margin: 4px 0 0 0;
    }
    
    .actions-right {
        display: flex;
        gap: 10px;
    }
    
    .btn-action {
        padding: 10px 20px;
        font-size: 13.5px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        border: none;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.2s ease;
    }
    
    .btn-print {
        background-color: #1ebbd7;
        color: white;
        box-shadow: 0 4px 12px rgba(30, 187, 215, 0.2);
    }
    .btn-print:hover {
        background-color: #17a3bc;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(30, 187, 215, 0.3);
    }
    .btn-close {
        background-color: #f1f5f9;
        color: #475569;
    }
    .btn-close:hover {
        background-color: #e2e8f0;
        color: #0f172a;
    }

    @page {
        size: A4 portrait;
        margin: 0;
    }

    .document-page-wrapper {
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    
    .document-page {
        background-color: #ffffff;
        width: 8.27in;
        height: 11.5in; /* Slightly less than 11.69in to prevent double page breaks */
        max-height: 11.5in;
        padding: 0.4in 0.5in; /* Restored padding */
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
        page-break-inside: avoid;
        display: flex;
        flex-direction: column;
    }

    /* Header Layout */
    .print-header-container {
        position: relative;
        text-align: center;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
    }
    .logo-placeholder {
        width: 60px;
        height: 60px;
        border: 2px dashed #ccc;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: #999;
    }
    .header-text h1 { font-size: 13px; margin: 0; text-transform: uppercase; font-weight: normal; color: black; }
    .header-text h2 { font-size: 15px; margin: 2px 0; font-weight: bold; color: black; }
    .header-text p { font-size: 11px; margin: 2px 0; color: black; }
    
    .print-room-title-block { position: relative; text-align: center; font-weight: bold; margin-bottom: 20px; color: black; min-height: 25px; }
    .print-room-title-block span { position: absolute; left: 0; top: 5px; font-size: 11px; }
    .print-room-title-block h3 { display: inline-block; font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 2px; margin: 0; }
    
    /* Schedule Table Styling */
    .print-table { width: 100%; border-collapse: collapse; font-size: 9.5px; text-align: center; margin-bottom: 10px; flex-grow: 1; }
    .print-table th, .print-table td { border: 1px solid #000; padding: 2px; height: 18px; vertical-align: middle; color: black; }
    .print-table th { background-color: #f2f2f2 !important; font-weight: bold; font-size: 11px; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color: black; }
    .print-table .time-col { background-color: #b4c6e7 !important; font-weight: bold; width: 14%; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color: black; white-space: nowrap; font-size: 9px; }
    
    /* Class detail block formatting */
    .class-box { display: flex; flex-direction: column; justify-content: center; height: 100%; line-height: 1.1; color: black; }
    .class-box .subject { font-weight: bold; font-size: 9.5px; }
    .class-box .section { font-size: 8.5px; }
    .class-box .instructor { text-transform: uppercase; font-size: 8.5px; margin-top: 1px;}
    .bg-yellow { background-color: #fff2cc !important; font-weight: bold; color: black; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;}
    .bg-gray { background-color: #e3e3e3 !important; color: black; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;}
    
    /* Footer */
    .print-footer-container { display: flex; justify-content: space-between; font-size: 11px; padding: 0; color: black; margin-top: auto; }
    .signature-block { width: 200px; }
    .signature-line { margin-top: 40px; border-top: 1px solid #000; padding-top: 5px; }
    .sign-name { font-weight: bold; }

    /* Print Overrides */
    @media print {
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .print-actions {
            display: none !important;
        }
        .document-page {
            box-shadow: none;
            padding: 0;
            width: 100%;
            min-height: auto;
            margin-bottom: 0;
        }
        .document-page:last-child {
            page-break-after: auto;
        }
    }
  </style>
  <link rel="stylesheet" href="style.css?v=1.0.3" />
  <style>
    html, body {
      height: auto !important;
      min-height: 100vh !important;
      overflow: auto !important;
      overflow-y: auto !important;
    }
  </style>
</head>
<body>

  <!-- Screen-Only Actions Ribbon -->
  <div class="print-actions">
      <div class="actions-left">
          <h1 id="actions-title">All Schedules Print Preview</h1>
          <p id="actions-subtitle">Review and verify before printing</p>
      </div>
      <div class="actions-right">
          <button class="btn-action btn-close" onclick="window.close()">Close</button>
          <button class="btn-action btn-print" onclick="triggerDownload()">Download PDF</button>
          <button class="btn-action btn-print" onclick="window.print()" style="background-color: #0f172a;">Print Document</button>
      </div>
  </div>

  <div id="pages-container" style="width: 8.27in; margin: 0 auto; background: white;">
      <div style="padding: 40px; color: #64748b; font-family: 'Plus Jakarta Sans', sans-serif; text-align: center;">Loading schedules...</div>
  </div>

  <script src="js/services/settings.service.js"></script>
  <script src="js/services/laboratory.service.js"></script>
  <script src="js/services/schedule.service.js"></script>
  <script src="js/scheduling/time-utils.js"></script>
  <script src="js/pages/print-all-schedules.js"></script>
</body>
</html>
