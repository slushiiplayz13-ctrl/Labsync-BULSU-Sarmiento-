<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSync – PC Issue Reports</title>
  <link rel="icon" href="/assets/LabSync (Logo Only).png" type="image/png">
  <meta name="view-transition" content="same-origin" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css?v=1.1.3" />
  <link rel="stylesheet" href="css/tutorial.css" />
  <script src="js/auth-check.js"></script>
  <script src="js/utils/core-utils.js"></script>
  <script src="js/utils/dom-utils.js"></script>
  <script src="js/services/report.service.js"></script>
  <script src="js/state/report.store.js"></script>
  <script src="js/reports/report.parser.js"></script>
  <script src="js/reports/report.filters.js"></script>
  <script src="js/reports/report.renderer.js"></script>
  <script src="js/reports/report.controller.js"></script>
  <style>
    /* Status Badges */
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-badge.pending {
      background: #FEF3C7;
      color: #D97706;
    }

    .status-badge.in-progress {
      background: #DBEAFE;
      color: #2563EB;
    }

    .status-badge.resolved {
      background: #D1FAE5;
      color: #059669;
    }

    /* Priority Badges */
    .priority-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .priority-badge.high {
      background: #FEE2E2;
      color: #DC2626;
    }

    .priority-badge.medium {
      background: #FEF3C7;
      color: #D97706;
    }

    .priority-badge.low {
      background: #EFF6FF;
      color: #2563EB;
    }

    /* Report Card & List Grid */
    .reports-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 16px;
    }

    #dynamicReportsList {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .toggle-completed-btn {
      white-space: nowrap;
      height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-body);
      border: 1px solid rgba(2, 132, 199, 0.2);
      background: var(--primary-teal-light);
      color: var(--primary-teal);
    }

    .toggle-completed-btn:hover {
      background: var(--primary-teal) !important;
      color: #FFFFFF !important;
      border-color: var(--primary-teal) !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--primary-teal-glow);
    }

    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal-container {
      background: #FFFFFF;
      border-radius: 20px;
      width: 90%;
      max-width: 960px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
    }

    .modal-close-btn {
      background: #F1F5F9;
      border: none;
      color: #64748B;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
    }

    .modal-close-btn:hover {
      background: #E2E8F0;
      color: var(--text-dark);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .report-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), box-shadow var(--transition);
      margin-bottom: 0;
    }

    .report-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>

<body data-page="pc-reports">

  <!-- ── SIDEBAR ─────────────────────────────────────────────── -->
  <aside class="sidebar">

    <nav class="sidebar-nav">
      <button class="sidebar-btn" data-tooltip="Dashboard" title="Dashboard"
        onclick="window.location.href='index.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-home">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </button>
      <button class="sidebar-btn" data-tooltip="Room Status" title="Room Status"
        onclick="window.location.href='room-status.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-monitor-dot">
          <circle cx="19" cy="6" r="3" />
          <path d="M22 12v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9" />
          <path d="M12 17v4" />
          <path d="M8 21h8" />
        </svg>
      </button>
      <button class="sidebar-btn active" data-tooltip="PC Reports" title="PC Reports"
        onclick="window.location.href='faculty-pc-reports.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-file-bar-chart-2">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
          <polyline points="14 2 14 8 20 8" />
          <path d="M12 18v-4" />
          <path d="M8 18v-2" />
          <path d="M16 18v-6" />
        </svg>
      </button>
      <button class="sidebar-btn" data-tooltip="My Schedule" title="My Schedule"
        onclick="window.location.href='my-schedule.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-calendar-days">
          <path d="M8 2v4" />
          <path d="M16 2v4" />
          <rect width="18" height="18" x="3" y="4" rx="2" />
          <path d="M3 10h18" />
          <path d="M8 14h.01" />
          <path d="M12 14h.01" />
          <path d="M16 14h.01" />
          <path d="M8 18h.01" />
          <path d="M12 18h.01" />
          <path d="M16 18h.01" />
        </svg>
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-bottom">
      <button class="sidebar-btn" data-tooltip="Help & Support" title="Help & Support" onclick="openHelpModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-circle-help">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
      </button>
      <button class="sidebar-btn" data-tooltip="Logout" title="Logout" onclick="handleLogout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-log-out">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" x2="9" y1="12" y2="12" />
        </svg>
      </button>
    </div>
  </aside>

  <!-- ── MAIN WRAPPER ─────────────────────────────────────────── -->
  <div class="main-wrapper">

    <!-- HEADER -->
    <header class="header">

      <!-- Logos -->
      <div class="header-logos" style="display: flex; align-items: center; gap: 14px;">
        <img src="assets/bsu-sarmiento-logo.png" alt="BSU Sarmiento Logo"
          style="height: 40px; width: auto; object-fit: contain;">
        <div class="logo-divider" style="width: 1px; height: 32px; background: var(--border-light);"></div>
        <img src="assets/labsync-logo.png" alt="LabSync Logo" style="height: 45px; width: auto; object-fit: contain;">
      </div>


      <!-- Right Profile -->
      <div class="header-right">
        <button class="notif-btn" title="Notifications" aria-label="Notifications">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-bell">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
          <span class="notif-dot"></span>
        </button>

        <div class="profile-dropdown">
          <div class="avatar"></div>
          <div class="profile-info">
            <span class="profile-name"></span>
            <span class="profile-role"></span>
          </div>
          <button class="chevron-btn" aria-label="Open Profile Menu">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-chevron-down">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
        </div>
        <script>
          (function () {
            try {
              var u = JSON.parse(sessionStorage.getItem("labsync_user") || "null");
              var hr = document.currentScript.parentElement;
              if (u && hr) {
                var n = hr.querySelector(".profile-name");
                var r = hr.querySelector(".profile-role");
                var a = hr.querySelector(".avatar");
                if (n && u.name) n.textContent = u.name;
                if (r && u.role) r.textContent = u.role;
                if (a) {
                  if (u.profilePhoto) a.innerHTML = "<img src=\"" + u.profilePhoto + "\" alt=\"Profile\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%;\">";
                  else if (u.name) a.textContent = u.name.split(" ").map(function (x) { return x[0]; }).join("").slice(0, 2).toUpperCase();
                }
              }
              var hasUnread = sessionStorage.getItem("labsync_has_unread_notifs") === "true";
              var d = hr ? hr.querySelector(".notif-dot") : null;
              if (d) d.style.display = hasUnread ? "block" : "none";
            } catch (e) { }
          })();
        </script>
      </div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">

      <!-- Greeting + Clock Row -->
      <div class="greeting-row">
        <div class="greeting-left">
          <h1 class="greeting-title" id="greetingText">PC Issue Reports</h1>
          <p class="greeting-sub" id="greetingSub">Track and manage computer issues and maintenance requests.</p>
        </div>
        <div class="clock-block">
          <div class="clock-time" id="clockTime"></div>
          <div class="clock-date" id="clockDate"></div>
          <script>
            (function () {
              try {
                var d = new Date(), DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds(), ampm = h >= 12 ? 'PM' : 'AM', fh = h % 12 || 12;
                var p = function (n) { return String(n).padStart(2, '0'); };
                var t = document.getElementById('clockTime'), dt = document.getElementById('clockDate');
                if (t) t.textContent = p(fh) + ':' + p(m) + ':' + p(s) + ' ' + ampm;
                if (dt) dt.textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
              } catch (e) { }
            })();
          </script>
        </div>
      </div>

      <!-- Main Content Card -->
      <div class="dashboard-card" style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
        <div class="reports-controls"
          style="display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
          <div class="search-box" style="max-width: 440px; width: 100%; position: relative;">
            <i data-lucide="search"
              style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #94A3B8;"></i>
            <input type="text" id="reportSearchInput" class="search-input"
              placeholder="Search by room, PC number, issue details, or student name...">
          </div>
          <div id="completedToggleContainer"></div>
        </div>

        <div id="dynamicReportsList">
          <div class="ui-empty-state">
            <div class="ui-empty-icon">
              <i data-lucide="file-bar-chart-2" style="width:24px;height:24px;"></i>
            </div>
            <p>Loading PC issue reports...</p>
          </div>
          <script>
            (function () {
              try {
                var container = document.getElementById('dynamicReportsList');
                var cached = JSON.parse(sessionStorage.getItem('labsync_cached_reports') || 'null');
                if (Array.isArray(cached) && container && window.reportController && typeof window.reportController.renderReports === 'function') {
                  window.reportController.renderReports(cached, container);
                }
              } catch (e) { }
            })();
          </script>
        </div>
      </div>
    </main>
  </div>

  <!-- Completed Tickets Modal -->
  <div id="completedTicketsModal" class="modal-backdrop" style="display: none;">
    <div class="modal-container completed-modal-container">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div
            style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: #D1FAE5; color: #059669; flex-shrink: 0;">
            <i data-lucide="check-circle-2" style="width: 22px; height: 22px;"></i>
          </div>
          <div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <h3
                style="font-size: 16px; font-weight: 600; color: var(--text-dark); margin: 0; font-family: var(--font-display);">
                Completed Tickets History</h3>
              <span id="modalResolvedCountBadge" class="modal-count-badge">0 Resolved</span>
            </div>
            <p style="font-size: 12px; font-weight: 500; color: var(--text-muted); margin: 2px 0 0 0;">View and filter
              historical resolved computer maintenance logs</p>
          </div>
        </div>
        <button type="button" class="modal-close-btn" data-action="close-completed-modal" title="Close (Esc)">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>

      <!-- Modal Filter & Search Toolbar -->
      <div class="modal-toolbar">
        <div class="modal-search-wrapper">
          <i data-lucide="search" class="modal-search-icon"></i>
          <input type="text" id="modalTicketSearch" placeholder="Search ticket #, room, PC, student, or issue..."
            autocomplete="off">
        </div>
        <div class="modal-time-filters">
          <button type="button" class="modal-filter-chip active" data-time-filter="all">All Time</button>
          <button type="button" class="modal-filter-chip" data-time-filter="7days">Past 7 Days</button>
          <button type="button" class="modal-filter-chip" data-time-filter="30days">Past 30 Days</button>
        </div>
      </div>

      <div class="modal-body" id="modalCompletedList">
        <!-- Scrollable completed ticket cards will be loaded here -->
      </div>
    </div>
  </div>

  <script src="js/utils/time-utils.js"></script>
  <script src="js/core/accessibility.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/core/tutorial-launcher.js"></script>
  <script src="js/services/user.service.js"></script>
  <script src="js/services/notification.service.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/profile/profile-dropdown.js"></script>
  <script src="js/components/profile/account-modal.js"></script>
  <script src="js/components/profile/password-modal.js"></script>
  <script src="js/components/profile/help-modal.js"></script>
  <script src="js/components/profile-menu.js"></script>
  <script src="js/components/notifications.js"></script>
  <script src="js/components/sidebar-nav.js"></script>
  <script src="js/core/app.js"></script>
  <script src="js/script.js?v=1.0.5"></script>
  <script src="js/reports/report.actions.js"></script>
  <script src="js/reports/report.modal.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/tutorial.js"></script>
</body>

</html>
