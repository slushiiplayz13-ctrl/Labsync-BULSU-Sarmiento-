<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSync – IT Dept Head PC Reports</title>
  <link rel="icon" href="/assets/LabSync (Logo Only).png" type="image/png">
  <meta name="view-transition" content="same-origin" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style id="auth-anti-flash">
    body {
      display: none !important;
    }
  </style>
  <script src="js/auth-check.js"></script>
  <style>
    /* Status Badges */
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-badge.pending {
      background: #FEF3C7;
      color: #D97706;
    }

    .status-badge.in-progress {
      background: #DBEAFE;
      color: #2563EB;
    }

    .status-badge.resolved {
      background: #D1FAE5;
      color: #059669;
    }

    /* Priority Badges */
    .priority-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .priority-badge.high {
      background: #FEE2E2;
      color: #DC2626;
    }

    .priority-badge.medium {
      background: #FEF3C7;
      color: #D97706;
    }

    .priority-badge.low {
      background: #EFF6FF;
      color: #2563EB;
    }

    /* Report Card & List Grid */
    .reports-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 16px;
    }

    #dynamicReportsList {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .toggle-completed-btn {
      white-space: nowrap;
      height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-body);
      border: 1px solid rgba(2, 132, 199, 0.2);
      background: var(--primary-teal-light);
      color: var(--primary-teal);
    }

    .toggle-completed-btn:hover {
      background: var(--primary-teal) !important;
      color: #FFFFFF !important;
      border-color: var(--primary-teal) !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--primary-teal-glow);
    }

    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal-container {
      background: #FFFFFF;
      border-radius: 20px;
      width: 90%;
      max-width: 960px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
    }

    .modal-close-btn {
      background: #F1F5F9;
      border: none;
      color: #64748B;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
    }

    .modal-close-btn:hover {
      background: #E2E8F0;
      color: var(--text-dark);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .report-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), box-shadow var(--transition);
      margin-bottom: 0;
    }

    .report-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
  </style>
  <link rel="stylesheet" href="style.css?v=1.0.3" />
</head>

<body data-page="pc-reports">

  <!-- ── SIDEBAR ─────────────────────────────────────────────── -->
  <aside class="sidebar">

    <nav class="sidebar-nav">
      <button class="sidebar-btn" data-tooltip="Dashboard" title="Dashboard"
        onclick="window.location.href='it-head-dashboard.html'">
        <i data-lucide="home" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn" data-tooltip="Room Status" title="Room Status"
        onclick="window.location.href='it-head-room-status.html'">
        <i data-lucide="monitor-dot" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn active" data-tooltip="PC Reports" title="PC Reports"
        onclick="window.location.href='it-head-pc-reports.html'">
        <i data-lucide="file-bar-chart-2" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn" data-tooltip="My Schedule" title="My Schedule"
        onclick="window.location.href='it-head-my-schedule.html'">
        <i data-lucide="calendar-days" style="width:24px;height:24px;"></i>
      </button>

      <div class="sidebar-divider" style="height: 1px; width: 60%; background: var(--border-light); margin: 8px auto;">
      </div>

      <button class="sidebar-btn desktop-only-btn" data-tooltip="Master Schedule" title="Master Schedule"
        onclick="window.location.href='master-schedule.html'">
        <i data-lucide="calendar" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn desktop-only-btn" data-tooltip="Faculty Management" title="Faculty Management"
        onclick="window.location.href='faculty-management.html'">
        <i data-lucide="users" style="width:24px;height:24px;"></i>
      </button>
      <div class="mobile-only-divider"
        style="width: 1px; height: 32px; background: var(--border-light); margin: auto 6px; align-self: center; flex-shrink: 0;">
      </div>
      <button class="sidebar-btn mobile-only-btn" data-tooltip="Admin Panel" title="Admin Panel"
        onclick="toggleAdminMenu(event, this)">
        <i data-lucide="folder-cog" style="width:24px;height:24px;"></i>
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-bottom">
      <button class="sidebar-btn" data-tooltip="Help & Support" title="Help & Support" onclick="openHelpModal()">
        <i data-lucide="circle-help" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn" data-tooltip="Logout" title="Logout" onclick="handleLogout()">
        <i data-lucide="log-out" style="width:24px;height:24px;"></i>
      </button>
    </div>
  </aside>

  <!-- Scroll Clue for Sidebar -->
  <div id="sidebarScrollClue"
    style="position: fixed; bottom: 16px; left: 30px; z-index: 105; color: var(--primary-teal); pointer-events: none; transition: opacity 0.3s ease;">
    <i data-lucide="chevron-down" style="width: 20px; height: 20px; animation: bounce 2s infinite;"></i>
  </div>
  <!-- ── MAIN WRAPPER ─────────────────────────────────────────── -->
  <div class="main-wrapper">

    <!-- HEADER -->
    <header class="header">

      <!-- Logos -->
      <div class="header-logos" style="display: flex; align-items: center; gap: 14px;">
        <img src="assets/bsu-sarmiento-logo.png" alt="BSU Sarmiento Logo"
          style="height: 40px; width: auto; object-fit: contain;">
        <div class="logo-divider" style="width: 1px; height: 32px; background: var(--border-light);"></div>
        <img src="assets/labsync-logo.png" alt="LabSync Logo" style="height: 45px; width: auto; object-fit: contain;">
      </div>


      <!-- Right Profile -->
      <div class="header-right">
        <button class="notif-btn" title="Notifications">
          <i data-lucide="bell" style="width:16px;height:16px;"></i>
          <span class="notif-dot"></span>
        </button>

        <div class="profile-dropdown">
          <div class="avatar">U</div>
          <div class="profile-info">
            <span class="profile-name">User</span>
            <span class="profile-role">IT Dept. Head</span>
          </div>
          <button class="chevron-btn">
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i>
          </button>
        </div>
      </div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">

      <!-- Greeting + Clock Row -->
      <div class="greeting-row">
        <div class="greeting-left">
          <h1 class="greeting-title" id="greetingText">PC Issue Reports</h1>
          <p class="greeting-sub" id="greetingSub">Track and manage computer issues and maintenance requests.</p>
        </div>
        <div class="clock-block">
          <div class="clock-time" id="clockTime">--:--:-- --</div>
          <div class="clock-date" id="clockDate">Loading…</div>
        </div>
      </div>

      <!-- Main Content Card -->
      <div class="dashboard-card" style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
        <div class="reports-controls"
          style="display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
          <div class="search-box" style="max-width: 440px; width: 100%; position: relative;">
            <i data-lucide="search"
              style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #94A3B8;"></i>
            <input type="text" id="reportSearchInput" class="search-input"
              placeholder="Search by room, PC number, issue details, or student name...">
          </div>
          <div id="completedToggleContainer"></div>
        </div>

        <div id="dynamicReportsList">
          <div class="ui-empty-state">
            <div class="ui-empty-icon">
              <i data-lucide="file-bar-chart-2" style="width:24px;height:24px;"></i>
            </div>
            <p>Loading PC issue reports...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/utils/core-utils.js"></script>
  <script src="js/utils/time-utils.js"></script>
  <script src="js/utils/dom-utils.js"></script>
  <script src="js/core/accessibility.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/core/tutorial-launcher.js"></script>
  <script src="js/services/user.service.js"></script>
  <script src="js/services/notification.service.js"></script>
  <script src="js/services/report.service.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/profile/profile-dropdown.js"></script>
  <script src="js/components/profile/account-modal.js"></script>
  <script src="js/components/profile/password-modal.js"></script>
  <script src="js/components/profile/help-modal.js"></script>
  <script src="js/components/profile-menu.js"></script>
  <script src="js/components/notifications.js"></script>
  <script src="js/components/sidebar-nav.js"></script>
  <script src="js/core/app.js"></script>
  <script src="js/script.js?v=1.0.5"></script>
  <script src="js/state/report.store.js"></script>
  <script src="js/reports/report.parser.js"></script>
  <script src="js/reports/report.filters.js"></script>
  <script src="js/reports/report.renderer.js"></script>
  <script src="js/reports/report.actions.js"></script>
  <script src="js/reports/report.modal.js"></script>
  <script src="js/reports/report.controller.js"></script>
  <script src="js/reports.js"></script>
  <script>
    const sidebar = document.querySelector('.sidebar');
    const scrollClue = document.getElementById('sidebarScrollClue');

    // Hide arrow if it's not scrollable
    if (sidebar && scrollClue) {
      if (sidebar.scrollHeight <= sidebar.clientHeight) {
        scrollClue.style.display = 'none';
      }

      // Hide arrow when scrolled
      sidebar.addEventListener('scroll', () => {
        if (sidebar.scrollTop > 10) {
          scrollClue.style.opacity = '0';
        } else {
          scrollClue.style.opacity = '1';
        }
      });
    }
  </script>

  <!-- Completed Tickets Modal -->
  <div id="completedTicketsModal" class="modal-backdrop" style="display: none;">
    <div class="modal-container completed-modal-container">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div
            style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: #D1FAE5; color: #059669; flex-shrink: 0;">
            <i data-lucide="check-circle-2" style="width: 22px; height: 22px;"></i>
          </div>
          <div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <h3 style="font-size: 16px; font-weight: 600; color: var(--text-dark); margin: 0; font-family: var(--font-display);">Completed Tickets History</h3>
              <span id="modalResolvedCountBadge" class="modal-count-badge">0 Resolved</span>
            </div>
            <p style="font-size: 12px; font-weight: 500; color: var(--text-muted); margin: 2px 0 0 0;">View and filter historical resolved computer maintenance logs</p>
          </div>
        </div>
        <button class="modal-close-btn" onclick="closeCompletedModal()" title="Close (Esc)">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>

      <!-- Modal Filter & Search Toolbar -->
      <div class="modal-toolbar">
        <div class="modal-search-wrapper">
          <i data-lucide="search" class="modal-search-icon"></i>
          <input type="text" id="modalTicketSearch" placeholder="Search ticket #, room, PC, student, or issue..." autocomplete="off">
        </div>
        <div class="modal-time-filters">
          <button type="button" class="modal-filter-chip active" data-time-filter="all">All Time</button>
          <button type="button" class="modal-filter-chip" data-time-filter="7days">Past 7 Days</button>
          <button type="button" class="modal-filter-chip" data-time-filter="30days">Past 30 Days</button>
        </div>
      </div>

      <div class="modal-body" id="modalCompletedList">
        <!-- Scrollable completed ticket cards will be loaded here -->
      </div>
    </div>
  </div>
  <script src="js/tutorial.js"></script>
</body>

</html>
