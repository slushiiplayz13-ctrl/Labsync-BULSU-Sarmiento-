<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="view-transition" content="same-origin" />
  <title>LabSync – Faculty Management</title>
  <link rel="icon" href="/assets/LabSync (Logo Only).png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style id="auth-anti-flash">
    body {
      display: none !important;
    }
  </style>
  <script src="js/auth-check.js"></script>
  <style>
    .menu-item:hover {
      background-color: #F3F4F6;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .sched-spinner {
      animation: spin 1s linear infinite;
    }
  </style>
  <link rel="stylesheet" href="style.css?v=1.0.3" />
</head>

<body data-page="faculty-management">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <nav class="sidebar-nav">
      <button class="sidebar-btn" data-tooltip="Dashboard" title="Dashboard"
        onclick="window.location.href='it-head-dashboard.html'">
        <i data-lucide="home" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn" data-tooltip="Room Status" title="Room Status"
        onclick="window.location.href='it-head-room-status.html'">
        <i data-lucide="monitor-dot" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn" data-tooltip="PC Reports" title="PC Reports"
        onclick="window.location.href='it-head-pc-reports.html'">
        <i data-lucide="file-bar-chart-2" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn" data-tooltip="My Schedule" title="My Schedule"
        onclick="window.location.href='it-head-my-schedule.html'">
        <i data-lucide="calendar-days" style="width:24px;height:24px;"></i>
      </button>

      <div class="sidebar-divider" style="height: 1px; width: 60%; background: var(--border-light); margin: 8px auto;">
      </div>

      <button class="sidebar-btn desktop-only-btn" data-tooltip="Master Schedule" title="Master Schedule"
        onclick="window.location.href='master-schedule.html'">
        <i data-lucide="calendar" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn desktop-only-btn active" data-tooltip="Faculty Management" title="Faculty Management"
        onclick="window.location.href='faculty-management.html'">
        <i data-lucide="users" style="width:24px;height:24px;"></i>
      </button>
      <div class="mobile-only-divider"
        style="width: 1px; height: 32px; background: var(--border-light); margin: auto 6px; align-self: center; flex-shrink: 0;">
      </div>
      <button class="sidebar-btn mobile-only-btn active" data-tooltip="Admin Panel" title="Admin Panel"
        onclick="toggleAdminMenu(event, this)">
        <i data-lucide="folder-cog" style="width:24px;height:24px;"></i>
      </button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <button class="sidebar-btn" data-tooltip="Help & Support" title="Help & Support" onclick="openHelpModal()">
        <i data-lucide="circle-help" style="width:24px;height:24px;"></i>
      </button>
      <button class="sidebar-btn" data-tooltip="Logout" title="Logout" onclick="handleLogout()">
        <i data-lucide="log-out" style="width:24px;height:24px;"></i>
      </button>
    </div>
  </aside>

  <!-- Scroll Clue -->
  <div id="sidebarScrollClue"
    style="position:fixed;bottom:16px;left:30px;z-index:105;color:var(--primary-teal);pointer-events:none;transition:opacity 0.3s ease;">
    <i data-lucide="chevron-down" style="width:20px;height:20px;animation:bounce 2s infinite;"></i>
  </div>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">

    <!-- HEADER -->
    <header class="header">
      <div class="header-logos" style="display:flex;align-items:center;gap:14px;">
        <img src="assets/bsu-sarmiento-logo.png" alt="BSU Logo" style="height:40px;width:auto;object-fit:contain;">
        <div style="width:1px;height:32px;background:var(--border-light);"></div>
        <img src="assets/labsync-logo.png" alt="LabSync Logo" style="height: 45px; width: auto; object-fit: contain;">
      </div>
      <div class="header-right">
        <button class="notif-btn" title="Notifications">
          <i data-lucide="bell" style="width:16px;height:16px;"></i>
          <span class="notif-dot"></span>
        </button>
        <div class="profile-dropdown">
          <div class="avatar">U</div>
          <div class="profile-info">
            <span class="profile-name">User</span>
            <span class="profile-role">IT Dept. Head</span>
          </div>
          <button class="chevron-btn">
            <i data-lucide="chevron-down" style="width:14px;height:14px;"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content" style="overflow-y:auto;">

      <div class="greeting-row" style="margin-bottom:16px;">
        <div class="greeting-left">
          <h1 class="greeting-title" id="greetingText">Faculty Management</h1>
          <p class="greeting-sub" id="greetingSub">Manage faculty members, assignments, and departmental information.
          </p>
        </div>
        <div class="clock-block">
          <div class="clock-time" id="clockTime">--:--:-- --</div>
          <div class="clock-date" id="clockDate">Loading…</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="fm-toolbar" style="margin-bottom:20px;">
        <div class="fm-search-row">
          <div class="fm-search">
            <i data-lucide="search" style="width:15px;height:15px;color:#94A3B8;flex-shrink:0;"></i>
            <input id="faculty-search" type="text" placeholder="Search faculty by name, email, or department..." />
          </div>
        </div>
        <button class="fm-add-btn" id="add-faculty-btn">
          <i data-lucide="user-plus" style="width:16px;height:16px;"></i>
          Add Faculty
        </button>
      </div>

      <!-- Faculty Grid -->
      <div class="faculty-grid" id="faculty-grid">
        <div class="ui-empty-state">
          <div class="ui-empty-icon">
            <i data-lucide="users" style="width:24px;height:24px;"></i>
          </div>
          <p>No faculty records yet. Add faculty or sync your directory to see members here.</p>
        </div>
      </div><!-- /faculty-grid -->
    </main>
  </div>

  <script src="js/utils/core-utils.js"></script>
  <script src="js/utils/dom-utils.js"></script>
  <script src="js/utils/faculty-utils.js"></script>
  <script src="js/core/accessibility.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/core/tutorial-launcher.js"></script>
  <script src="js/services/user.service.js"></script>
  <script src="js/services/notification.service.js"></script>
  <script src="js/services/faculty.service.js"></script>
  <script src="js/scheduling/time-utils.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/profile-menu.js"></script>
  <script src="js/components/notifications.js"></script>
  <script src="js/components/custom-select.js"></script>
  <script src="js/components/sidebar-nav.js"></script>
  <script src="js/components/faculty-card.js"></script>
  <script src="js/components/faculty-menu.js"></script>
  <script src="js/components/faculty-modal.js"></script>
  <script src="js/components/faculty-schedule-modal.js"></script>
  <script src="js/pages/faculty-management.js"></script>
  <script src="js/core/app.js"></script>
  <script src="js/script.js?v=1.0.5"></script>
  <script src="js/tutorial.js"></script>
</body>

</html>
