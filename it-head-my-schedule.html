<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSync – IT Dept Head My Schedule</title>
  <link rel="icon" href="/assets/LabSync (Logo Only).png" type="image/png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css?v=1.1.3" />
  <link rel="stylesheet" href="css/schedule-studio.css" />
  <link rel="stylesheet" href="css/tutorial.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/auth-check.js"></script>
  <script src="js/utils/core-utils.js"></script>
  <script src="js/utils/dom-utils.js"></script>
  <script src="js/services/schedule.service.js"></script>
  <script src="js/scheduling/time-utils.js"></script>
  <script src="js/scheduling/colors.js"></script>
  <script src="js/faculty-schedule/faculty-schedule.colors.js"></script>
  <script src="js/faculty-schedule/faculty-schedule.renderer.js"></script>
  <script src="js/faculty-schedule/faculty-schedule.filters.js"></script>
  <script src="js/faculty-schedule/faculty-schedule.controller.js"></script>
  <style>
    .schedule-columns {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 14px;
      overflow-x: auto;
      min-width: 800px;
      flex: 1;
      align-items: stretch;
    }

    .day-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 480px;
      height: 100%;
      box-sizing: border-box;
      background: #F8FAFC;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 12px;
      transition: all 0.2s ease;
    }

    .day-column.highlight-day {
      border-color: var(--primary-teal);
      background: var(--primary-teal-light);
      box-shadow: 0 4px 12px var(--primary-teal-glow);
    }

    .day-header {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-mid);
      text-align: center;
      padding: 8px;
      background: var(--bg-white);
      border-radius: 10px;
      margin-bottom: 4px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }

    .day-column.highlight-day .day-header {
      background: var(--primary-teal);
      color: #fff;
      border-color: var(--primary-teal);
    }

    .sg-cell.filled {
      cursor: pointer;
    }
  </style>
</head>

<body data-page="my-schedule">

  <!-- ── SIDEBAR ─────────────────────────────────────────────── -->
  <aside class="sidebar">

    <nav class="sidebar-nav">
      <button class="sidebar-btn" data-tooltip="Dashboard" title="Dashboard"
        onclick="window.location.href='it-head-dashboard.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-home">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </button>
      <button class="sidebar-btn" data-tooltip="Room Status" title="Room Status"
        onclick="window.location.href='it-head-room-status.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-monitor-dot">
          <circle cx="19" cy="6" r="3" />
          <path d="M22 12v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9" />
          <path d="M12 17v4" />
          <path d="M8 21h8" />
        </svg>
      </button>
      <button class="sidebar-btn" data-tooltip="PC Reports" title="PC Reports"
        onclick="window.location.href='it-head-pc-reports.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-file-bar-chart-2">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
          <polyline points="14 2 14 8 20 8" />
          <path d="M12 18v-4" />
          <path d="M8 18v-2" />
          <path d="M16 18v-6" />
        </svg>
      </button>
      <button class="sidebar-btn active" data-tooltip="My Schedule" title="My Schedule"
        onclick="window.location.href='it-head-my-schedule.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-calendar-days">
          <path d="M8 2v4" />
          <path d="M16 2v4" />
          <rect width="18" height="18" x="3" y="4" rx="2" />
          <path d="M3 10h18" />
          <path d="M8 14h.01" />
          <path d="M12 14h.01" />
          <path d="M16 14h.01" />
          <path d="M8 18h.01" />
          <path d="M12 18h.01" />
          <path d="M16 18h.01" />
        </svg>
      </button>

      <div class="sidebar-divider" style="height: 1px; width: 60%; background: var(--border-light); margin: 8px auto;">
      </div>

      <button class="sidebar-btn desktop-only-btn" data-tooltip="Master Schedule" title="Master Schedule"
        onclick="window.location.href='master-schedule.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-calendar">
          <path d="M8 2v4" />
          <path d="M16 2v4" />
          <rect width="18" height="18" x="3" y="4" rx="2" />
          <path d="M3 10h18" />
        </svg>
      </button>
      <button class="sidebar-btn desktop-only-btn" data-tooltip="Faculty Management" title="Faculty Management"
        onclick="window.location.href='faculty-management.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-users">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </button>
      <div class="mobile-only-divider"
        style="width: 1px; height: 32px; background: var(--border-light); margin: auto 6px; align-self: center; flex-shrink: 0;">
      </div>
      <button class="sidebar-btn mobile-only-btn" data-tooltip="Admin Panel" title="Admin Panel"
        onclick="toggleAdminMenu(event, this)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-folder-cog">
          <path
            d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z" />
          <circle cx="12" cy="13" r="2" />
          <path d="m12 9 .8 1.6" />
          <path d="m12 17 .8-1.6" />
          <path d="m14.8 10.2 1.4-.9" />
          <path d="m9.2 15.8 1.4-.9" />
          <path d="m16 13h-1.6" />
          <path d="m8 13h1.6" />
          <path d="m14.8 15.8-1.4-.9" />
          <path d="m9.2 10.2-1.4-.9" />
        </svg>
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-bottom">
      <button class="sidebar-btn" data-tooltip="Help & Support" title="Help & Support" onclick="openHelpModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-circle-help">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
      </button>
      <button class="sidebar-btn" data-tooltip="Logout" title="Logout" onclick="handleLogout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-log-out">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" x2="9" y1="12" y2="12" />
        </svg>
      </button>
    </div>
  </aside>

  <!-- ── MAIN WRAPPER ─────────────────────────────────────────── -->
  <div class="main-wrapper">

    <!-- HEADER -->
    <header class="header">

      <!-- Logos -->
      <div class="header-logos" style="display: flex; align-items: center; gap: 14px;">
        <img src="assets/bsu-sarmiento-logo.png" alt="BSU Sarmiento Logo"
          style="height: 40px; width: auto; object-fit: contain;">
        <div class="logo-divider" style="width: 1px; height: 32px; background: var(--border-light);"></div>
        <img src="assets/labsync-logo.png" alt="LabSync Logo" style="height: 45px; width: auto; object-fit: contain;">
      </div>


      <!-- Right Profile -->
      <div class="header-right">
        <button class="notif-btn" title="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-bell">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
          <span class="notif-dot"></span>
        </button>

        <div class="profile-dropdown">
          <div class="avatar"></div>
          <div class="profile-info">
            <span class="profile-name"></span>
            <span class="profile-role"></span>
          </div>
          <button class="chevron-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-chevron-down">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
        </div>
        <script>
          (function () {
            try {
              var u = JSON.parse(sessionStorage.getItem("labsync_user") || "null");
              var hr = document.currentScript.parentElement;
              if (u && hr) {
                var n = hr.querySelector(".profile-name");
                var r = hr.querySelector(".profile-role");
                var a = hr.querySelector(".avatar");
                if (n && u.name) n.textContent = u.name;
                if (r && u.role) r.textContent = u.role;
                if (a) {
                  if (u.profilePhoto) a.innerHTML = "<img src=\"" + u.profilePhoto + "\" alt=\"Profile\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%;\">";
                  else if (u.name) a.textContent = u.name.split(" ").map(function (x) { return x[0]; }).join("").slice(0, 2).toUpperCase();
                }
              }
              var hasUnread = sessionStorage.getItem("labsync_has_unread_notifs") === "true";
              var d = hr ? hr.querySelector(".notif-dot") : null;
              if (d) d.style.display = hasUnread ? "block" : "none";
            } catch (e) { }
          })();
        </script>
      </div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">

      <!-- Greeting + Clock Row -->
      <div class="greeting-row">
        <div class="greeting-left">
          <h1 class="greeting-title" id="greetingText">My Schedule</h1>
          <p class="greeting-sub" id="greetingSub">View your complete weekly teaching schedule and class assignments.
          </p>
        </div>
        <div class="clock-block">
          <div class="clock-time" id="clockTime"></div>
          <div class="clock-date" id="clockDate"></div>
          <script>
            (function () {
              try {
                var d = new Date(), DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds(), ampm = h >= 12 ? 'PM' : 'AM', fh = h % 12 || 12;
                var p = function (n) { return String(n).padStart(2, '0'); };
                var t = document.getElementById('clockTime'), dt = document.getElementById('clockDate');
                if (t) t.textContent = p(fh) + ':' + p(m) + ':' + p(s) + ' ' + ampm;
                if (dt) dt.textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
              } catch (e) { }
            })();
          </script>
        </div>
      </div>

      <!-- Main Content Card -->
      <div class="dashboard-card"
        style="padding: 0; overflow: hidden !important; border-radius: 12px; position: relative; display: flex; flex-direction: column; flex: 1; min-height: fit-content;">
        <!-- Header -->
        <div class="schedule-header"
          style="background: var(--primary-teal); color: white; padding: 12px 24px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 15px; border-radius: 12px 12px 0 0; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="calendar" style="width: 20px; height: 20px;"></i> My Weekly Schedule
          </div>

          <!-- In-Header Selector Panel -->
          <div class="schedule-selectors" style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px;">
            <button type="button" class="btn-schedule-studio"
              title="Custom Schedule Wallpaper & Card Generator">
              <span class="studio-btn-icon-badge">
                <i data-lucide="palette" style="width:14px;height:14px;"></i>
              </span>
              <span>Schedule Studio</span>
            </button>

            <div style="display: flex; align-items: center; gap: 6px;">
              <span
                style="font-size: 12.5px; font-weight: 600; color: rgba(255, 255, 255, 0.95); font-family: var(--font-display);">AY:</span>
              <div class="custom-select-wrapper header-select" id="academic-year-wrapper" style="width: 125px;">
                <div class="custom-select-trigger"
                  style="padding: 5px 10px; font-size: 12.5px; border-radius: 6px; height: auto;">
                  <span>Select</span>
                  <i data-lucide="chevron-down"></i>
                </div>
                <div class="custom-select-dropdown" style="color: var(--text-dark);"></div>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 6px;">
              <span
                style="font-size: 12.5px; font-weight: 600; color: rgba(255, 255, 255, 0.95); font-family: var(--font-display);">Sem:</span>
              <div class="custom-select-wrapper header-select" id="semester-wrapper" style="width: 135px;">
                <div class="custom-select-trigger"
                  style="padding: 5px 8px; font-size: 12.5px; border-radius: 6px; height: auto;">
                  <span>1st Semester</span>
                  <i data-lucide="chevron-down"></i>
                </div>
                <div class="custom-select-dropdown" style="color: var(--text-dark);">
                  <div class="custom-select-option selected" data-value="1st Semester">1st Semester</div>
                  <div class="custom-select-option" data-value="2nd Semester">2nd Semester</div>
                  <div class="custom-select-option" data-value="Summer">Summer</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="schedule-container" style="padding: 24px; display: flex; flex-direction: column; gap: 20px; flex: 1;">

          <div class="ui-empty-state">
            <div class="ui-empty-icon">
              <i data-lucide="calendar-days" style="width:24px;height:24px;"></i>
            </div>
            <p>Loading your schedule...</p>
          </div>
          <script>
            (function () {
              try {
                var container = document.getElementById('schedule-container');
                var cached = JSON.parse(sessionStorage.getItem('labsync_cached_user_schedule') || 'null');
                if (Array.isArray(cached) && container && window.facultyScheduleController && typeof window.facultyScheduleController.renderFacultySchedule === 'function') {
                  window.facultyScheduleController.renderFacultySchedule(cached, container);
                }
              } catch (e) { }
            })();
          </script>
        </div>
      </div>
    </main>
  </div>

  <script src="js/components/notifications.js"></script>
  <script src="js/components/custom-select.js"></script>
  <script src="js/components/sidebar-nav.js"></script>
  <script src="js/core/app.js"></script>
  <script src="js/script.js?v=1.0.5"></script>
  <script src="js/schedule.js"></script>
  <script src="js/schedule-studio.js"></script>
  <script src="js/tutorial.js"></script>
</body>
