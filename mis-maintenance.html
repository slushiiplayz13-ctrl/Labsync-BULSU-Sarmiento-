<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSync - Maintenance Tracker</title>
  <link rel="icon" href="/assets/LabSync (Logo Only).png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css?v=1.0.7" />
  <script src="js/auth-check.js"></script>
  <script src="js/utils/core-utils.js"></script>
  <script src="js/utils/dom-utils.js"></script>
  <script src="js/reports/report.parser.js"></script>
  <script src="js/pages/mis-maintenance/maintenance.renderer.js?v=1.0.8"></script>
  <style>
    /* Filter Pills */
    .filter-pills-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .filter-pill {
      border: 1.5px solid var(--border-light);
      background: #FFFFFF;
      color: var(--text-mid);
      padding: 9px 22px;
      border-radius: 9999px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .filter-pill i,
    .filter-pill svg {
      width: 16px !important;
      height: 16px !important;
    }

    .filter-pill:hover {
      border-color: var(--primary-teal);
      color: var(--primary-teal);
      background: #F0FDFD;
    }

    .filter-pill.active {
      background: var(--primary-teal);
      color: #FFFFFF;
      border-color: var(--primary-teal);
      box-shadow: 0 4px 14px rgba(30, 187, 215, 0.35);
    }

    @media (max-width: 768px) {
      .maint-controls-row {
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 12px !important;
        margin-bottom: 8px !important;
      }

      .filter-pills-row {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        width: 100% !important;
        gap: 6px !important;
        margin-bottom: 2px !important;
      }

      .filter-pill {
        flex: 1 1 0% !important;
        min-width: 0 !important;
        padding: 8px 6px !important;
        font-size: 12px !important;
        justify-content: center !important;
        text-align: center !important;
        white-space: nowrap !important;
      }

      .filter-pill i,
      .filter-pill svg {
        width: 13px !important;
        height: 13px !important;
      }

      .maint-search-wrap {
        width: 100% !important;
        margin-top: 0 !important;
      }

      .maint-search-wrap .search-box {
        width: 100% !important;
      }

      /* Mobile Card View for Maintenance Table */
      .maint-table-wrapper,
      html.dark-mode .maint-table-wrapper,
      body.dark-mode .maint-table-wrapper,
      [data-theme="dark"] .maint-table-wrapper,
      html.high-contrast .maint-table-wrapper {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        max-height: calc(100vh - 270px) !important;
        padding: 0 2px !important;
        -webkit-overflow-scrolling: touch !important;
      }

      .maint-table colgroup,
      .maint-table col,
      .maint-table thead {
        display: none !important;
        width: 0 !important;
      }

      .maint-table {
        table-layout: auto !important;
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
      }

      .maint-table tbody {
        display: flex !important;
        flex-direction: column !important;
        gap: 14px !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .maint-table tr.maintenance-row {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 12px 10px !important;
        background: #FFFFFF !important;
        border: 1px solid var(--border-light, #E2E8F0) !important;
        border-radius: 16px !important;
        padding: 16px !important;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05) !important;
        box-sizing: border-box !important;
        width: 100% !important;
      }

      html.dark-mode .maint-table tr.maintenance-row,
      body.dark-mode .maint-table tr.maintenance-row,
      [data-theme="dark"] .maint-table tr.maintenance-row,
      html.high-contrast .maint-table tr.maintenance-row {
        background: #161F30 !important;
        border-color: rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25) !important;
      }

      .maint-table tr.maintenance-row td {
        display: block !important;
        padding: 0 !important;
        border: none !important;
        white-space: normal !important;
        min-width: 0 !important;
        max-width: none !important;
        box-sizing: border-box !important;
      }

      /* Row 1: Date on Left, Ticket ID on Right */
      .maint-table tr.maintenance-row td.col-date {
        grid-column: 1 / 2 !important;
        grid-row: 1 !important;
        width: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;
        margin: 0 !important;
      }

      .maint-table tr.maintenance-row td.col-ticket {
        grid-column: 2 / 3 !important;
        grid-row: 1 !important;
        width: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: flex-end !important;
        margin: 0 !important;
      }

      .maint-table tr.maintenance-row td.col-ticket .ticket-chip {
        font-size: 12.5px !important;
        padding: 4px 11px !important;
        white-space: nowrap !important;
      }

      .maint-table tr.maintenance-row td.col-date .col-date-wrap {
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px !important;
        white-space: nowrap !important;
      }

      .maint-table tr.maintenance-row td.col-date .col-date-icon {
        width: 15px !important;
        height: 15px !important;
        color: var(--primary-teal, #1EBBD7) !important;
        flex-shrink: 0 !important;
      }

      .maint-table tr.maintenance-row td.col-date .col-date-text {
        display: inline-flex !important;
        flex-direction: row !important;
        align-items: baseline !important;
        gap: 6px !important;
        white-space: nowrap !important;
      }

      .maint-table tr.maintenance-row td.col-date .date-main {
        font-size: 13px !important;
        font-weight: 700 !important;
        color: var(--text-dark, #0F172A) !important;
        white-space: nowrap !important;
      }

      .maint-table tr.maintenance-row td.col-date .date-main::after {
        content: "•";
        margin-left: 6px;
        color: var(--text-muted, #94A3B8);
        font-weight: 400;
      }

      html.high-contrast .maint-table tr.maintenance-row td.col-date .date-main,
      body.high-contrast .maint-table tr.maintenance-row td.col-date .date-main,
      html.dark-mode .maint-table tr.maintenance-row td.col-date .date-main,
      body.dark-mode .maint-table tr.maintenance-row td.col-date .date-main,
      html.dark .maint-table tr.maintenance-row td.col-date .date-main,
      body.dark .maint-table tr.maintenance-row td.col-date .date-main,
      html.dark-theme .maint-table tr.maintenance-row td.col-date .date-main,
      body.dark-theme .maint-table tr.maintenance-row td.col-date .date-main,
      [data-theme="dark"] .maint-table tr.maintenance-row td.col-date .date-main {
        color: #F1F5F9 !important;
      }

      .maint-table tr.maintenance-row td.col-date .time-sub {
        font-size: 12px !important;
        font-weight: 500 !important;
        color: var(--text-muted, #94A3B8) !important;
        white-space: nowrap !important;
      }

      /* Row 2: Room and PC Units - side by side symmetrical pill boxes */
      .maint-table tr.maintenance-row td.col-room {
        grid-column: 1 / 2 !important;
        grid-row: 2 !important;
        width: 100% !important;
        display: flex !important;
        align-items: center !important;
        margin: 0 !important;
      }

      .maint-table tr.maintenance-row td.col-pc {
        grid-column: 2 / 3 !important;
        grid-row: 2 !important;
        width: 100% !important;
        display: flex !important;
        align-items: center !important;
        margin: 0 !important;
      }

      .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap {
        display: inline-flex !important;
        align-items: center !important;
        gap: 7px !important;
        width: 100% !important;
        background: #F8FAFC !important;
        border: 1px solid var(--border-light, #E2E8F0) !important;
        border-radius: 10px !important;
        padding: 8px 10px !important;
        box-sizing: border-box !important;
        font-size: 12.5px !important;
        font-weight: 600 !important;
        color: var(--text-dark, #0F172A) !important;
      }

      html.high-contrast .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      body.high-contrast .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      html.dark-mode .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      body.dark-mode .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      html.dark .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      body.dark .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      html.dark-theme .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      body.dark-theme .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      [data-theme="dark"] .maint-table tr.maintenance-row td.col-room .cell-icon-wrap,
      html.high-contrast .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      body.high-contrast .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      html.dark-mode .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      body.dark-mode .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      html.dark .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      body.dark .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      html.dark-theme .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      body.dark-theme .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap,
      [data-theme="dark"] .maint-table tr.maintenance-row td.col-pc .cell-icon-wrap {
        background: rgba(15, 23, 42, 0.6) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.12) !important;
        color: #F8FAFC !important;
      }

      .maint-table tr.maintenance-row td.col-room .cell-icon,
      .maint-table tr.maintenance-row td.col-pc .cell-icon {
        width: 15px !important;
        height: 15px !important;
        flex-shrink: 0 !important;
      }

      /* Row 3: Reporter Chip (Hidden - viewable in Ticket Details modal) */
      .maint-table tr.maintenance-row td.col-reporter {
        grid-column: 1 / -1 !important;
        grid-row: 3 !important;
        width: 100% !important;
        overflow: visible !important;
        display: none !important;
        align-items: center !important;
        margin: 0 !important;
      }

      .maint-table tr.maintenance-row td.col-reporter .reporter-chip {
        max-width: 100% !important;
        width: fit-content !important;
        box-sizing: border-box !important;
      }

      .maint-table tr.maintenance-row td.col-reporter .reporter-chip .reporter-chip-name {
        max-width: none !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }

      /* Row 3: Issues & Remarks */
      .maint-table tr.maintenance-row td.col-issues {
        grid-column: 1 / -1 !important;
        grid-row: 3 !important;
        width: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 8px !important;
        margin: 0 !important;
      }

      .maint-table tr.maintenance-row td.col-issues .ticket-badge-group {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 6px !important;
        margin: 0 !important;
        width: 100% !important;
      }

      .maint-table tr.maintenance-row td.col-issues .remarks-quote-box {
        width: 100% !important;
        box-sizing: border-box !important;
        margin: 0 !important;
      }

      /* Row 4: Actions Button / Completed Chip */
      .maint-table tr.maintenance-row td.col-actions {
        grid-column: 1 / -1 !important;
        grid-row: 4 !important;
        width: 100% !important;
        margin-top: 4px !important;
        padding-top: 12px !important;
        border-top: 1px dashed var(--border-light, #E2E8F0) !important;
        display: block !important;
        box-sizing: border-box !important;
      }

      html.high-contrast .maint-table tr.maintenance-row td.col-actions,
      body.high-contrast .maint-table tr.maintenance-row td.col-actions,
      html.dark-mode .maint-table tr.maintenance-row td.col-actions,
      body.dark-mode .maint-table tr.maintenance-row td.col-actions,
      html.dark .maint-table tr.maintenance-row td.col-actions,
      body.dark-table tr.maintenance-row td.col-actions,
      html.dark-theme .maint-table tr.maintenance-row td.col-actions,
      body.dark-theme .maint-table tr.maintenance-row td.col-actions,
      [data-theme="dark"] .maint-table tr.maintenance-row td.col-actions {
        border-top-color: rgba(255, 255, 255, 0.1) !important;
      }

      .maint-table tr.maintenance-row td.col-actions .table-actions-cluster {
        display: flex !important;
        flex-direction: column !important;
        gap: 8px !important;
        width: 100% !important;
      }

      .maint-table tr.maintenance-row td.col-actions .btn-view-ticket-info,
      .maint-table tr.maintenance-row td.col-actions .btn-resolve-ticket,
      .maint-table tr.maintenance-row td.col-actions .completed-chip {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        min-height: 42px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        padding: 10px 16px !important;
        border-radius: 12px !important;
        font-size: 13.5px !important;
        font-weight: 700 !important;
        box-sizing: border-box !important;
        white-space: nowrap !important;
        text-align: center !important;
      }

      /* Empty / status message rows */
      .maint-table tr:not(.maintenance-row) {
        display: block !important;
        width: 100% !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }

      .maint-table tr:not(.maintenance-row) td {
        display: block !important;
        width: 100% !important;
        text-align: center !important;
        padding: 36px 16px !important;
      }
    }

    .maint-controls-row {
      position: sticky;
      top: 0;
      background: transparent !important;
      z-index: 25;
      padding-top: 0;
      padding-bottom: 4px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-direction: row;
      gap: 16px;
    }

    .filter-pills-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      margin-bottom: 0;
    }

    .maint-search-wrap {
      display: flex;
      align-items: center;
      margin-top: 0;
    }

    /* Table Enhancements */
    .maint-table-wrapper {
      background: #FFFFFF;
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      overflow-y: auto !important;
      overflow-x: auto !important;
      flex: 1 1 auto !important;
      min-height: 250px;
      max-height: none !important;
      -webkit-overflow-scrolling: touch;
      width: 100% !important;
      box-sizing: border-box;
    }

    .maint-table {
      table-layout: fixed !important;
      width: 100% !important;
      border-collapse: collapse;
    }

    @media (min-width: 769px) {
      .maint-table {
        min-width: 900px;
      }
      .maint-table th.col-ticket, .maint-table td.col-ticket { width: 13% !important; min-width: 105px; }
      .maint-table th.col-date, .maint-table td.col-date { width: 14% !important; min-width: 125px; }
      .maint-table th.col-room, .maint-table td.col-room { width: 13% !important; min-width: 105px; }
      .maint-table th.col-pc, .maint-table td.col-pc { width: 12% !important; min-width: 95px; }
      .maint-table th.col-issues, .maint-table td.col-issues { width: 28% !important; min-width: 220px; }
      .maint-table th.col-actions, .maint-table td.col-actions { width: 20% !important; min-width: 250px !important; text-align: center !important; padding-right: 36px !important; }
      .maint-table th:first-child, .maint-table tr:not(.maintenance-empty-row) td:first-child { padding-left: 20px !important; }
      .maint-table th:last-child, .maint-table tr:not(.maintenance-empty-row) td:last-child { padding-right: 36px !important; }
    }

    .maint-table-wrapper::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .maint-table-wrapper::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 99px;
    }

    .maint-table-wrapper::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 99px;
    }

    .maint-table-wrapper::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    .maint-table thead {
      position: sticky;
      top: -1px;
      z-index: 12;
    }

    .maint-table th {
      padding: 14px 14px;
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border-light, #E2E8F0);
      box-shadow: none;
      position: sticky;
      top: -1px;
      z-index: 10;
      white-space: nowrap;
    }

    .maint-table td {
      padding: 15px 14px;
      vertical-align: middle;
      border-bottom: 1px solid #F1F5F9;
      font-size: 13.5px;
    }

    @media (min-width: 769px) {
      .maint-table th:first-child,
      .maint-table td:first-child {
        padding-left: 22px !important;
      }

      .maint-table th:last-child,
      .maint-table td:last-child {
        padding-right: 22px !important;
      }
    }

    .maint-table tr:last-child td {
      border-bottom: none;
    }

    .maint-table tr {
      transition: background 0.15s ease;
    }

    .maint-table tr:hover {
      background: #FAFDFE;
    }

    /* Ticket ID Badge */
    .ticket-chip,
    .ticket-id-tag {
      font-weight: 700;
      font-family: var(--font-display);
      color: #0284C7;
      background: #E0F2FE;
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1.5px solid #BAE6FD;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13.5px;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ticket-chip:hover,
    .ticket-id-tag:hover {
      background: #0284C7;
      color: #FFFFFF;
      border-color: #0284C7;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
    }

    .btn-others-count:hover {
      background: var(--primary-teal) !important;
      color: #FFFFFF !important;
      border-color: var(--primary-teal) !important;
      box-shadow: 0 4px 12px rgba(30, 187, 215, 0.3) !important;
    }

    /* Modern Interactive Reporter Chip */
    .reporter-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: #F1F5F9;
      border: 1.5px solid #CBD5E1;
      color: #0F172A;
      font-weight: 700;
      font-size: 13px;
      user-select: none;
      white-space: nowrap;
      max-width: 100%;
      box-sizing: border-box;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reporter-chip.multi {
      cursor: pointer;
    }

    .reporter-chip.single {
      cursor: default !important;
    }

    .reporter-chip .reporter-chip-name {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-dark);
      letter-spacing: 0.1px;
      display: inline-block;
      max-width: 125px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .reporter-chip .reporter-count-badge {
      font-size: 11px;
      font-weight: 800;
      background: rgba(30, 187, 215, 0.18);
      color: var(--primary-teal);
      padding: 2px 7px;
      border-radius: 9999px;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .reporter-chip .reporter-chip-arrow {
      transition: transform 0.2s ease, color 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    .reporter-chip.multi:hover {
      background: #E0F2FE;
      border-color: #38BDF8;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.22);
      transform: translateY(-1px);
    }

    .reporter-chip.multi:hover .reporter-chip-arrow {
      transform: translateX(3px);
      color: #0284C7 !important;
      opacity: 1 !important;
    }

    /* Dark Mode Overrides for Reporter Chip */
    html.dark-mode .reporter-chip,
    body.dark-mode .reporter-chip,
    [data-theme="dark"] .reporter-chip,
    html.high-contrast .reporter-chip {
      background: rgba(15, 23, 42, 0.6) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
      color: #F1F5F9 !important;
    }

    html.dark-mode .reporter-chip.multi:hover,
    body.dark-mode .reporter-chip.multi:hover,
    [data-theme="dark"] .reporter-chip.multi:hover,
    html.high-contrast .reporter-chip.multi:hover {
      background: rgba(6, 182, 212, 0.15) !important;
      border-color: #38BDF8 !important;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25) !important;
    }

    /* Component Tags */
    .issue-tag {
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
