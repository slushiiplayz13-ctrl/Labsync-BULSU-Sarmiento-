<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabSync - Maintenance Tracker</title>
  <link rel="icon" href="/assets/LabSync (Logo Only).png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css?v=1.0.7" />
  <script src="js/auth-check.js"></script>
  <script src="js/utils/core-utils.js"></script>
  <script src="js/utils/dom-utils.js"></script>
  <script src="js/reports/report.parser.js"></script>
  <script src="js/pages/mis-maintenance/maintenance.renderer.js?v=1.0.6"></script>
  <style>
    /* Filter Pills */
    .filter-pills-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .filter-pill {
      border: 1.5px solid var(--border-light);
      background: #FFFFFF;
      color: var(--text-mid);
      padding: 9px 22px;
      border-radius: 9999px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .filter-pill i,
    .filter-pill svg {
      width: 16px !important;
      height: 16px !important;
    }

    .filter-pill:hover {
      border-color: var(--primary-teal);
      color: var(--primary-teal);
      background: #F0FDFD;
    }

    .filter-pill.active {
      background: var(--primary-teal);
      color: #FFFFFF;
      border-color: var(--primary-teal);
      box-shadow: 0 4px 14px rgba(30, 187, 215, 0.35);
    }

    @media (max-width: 600px) {
      .maint-controls-row {
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 14px !important;
        margin-bottom: 6px !important;
      }

      .filter-pills-row {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        width: 100% !important;
        gap: 6px !important;
        margin-bottom: 4px !important;
      }

      .filter-pill {
        flex: 1 1 0% !important;
        min-width: 0 !important;
        padding: 7px 4px !important;
        font-size: 11.5px !important;
        justify-content: center !important;
        text-align: center !important;
        white-space: nowrap !important;
      }

      .filter-pill i,
      .filter-pill svg {
        width: 12px !important;
        height: 12px !important;
      }

      .maint-search-wrap {
        width: 100% !important;
        margin-top: 4px !important;
      }

      .maint-search-wrap .search-box {
        width: 100% !important;
      }

      /* Mobile Card View for Maintenance Table */
      .maint-table-wrapper {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        max-height: calc(100vh - 280px) !important;
        padding-right: 2px !important;
        -webkit-overflow-scrolling: touch !important;
      }

      .maint-table,
      .maint-table tbody {
        display: flex !important;
        flex-direction: column !important;
        gap: 12px !important;
        width: 100% !important;
      }

      .maint-table thead {
        display: none !important;
      }

      .maint-table tr {
        display: flex !important;
        flex-direction: column !important;
        gap: 10px !important;
        background: #FFFFFF !important;
        border: 1px solid var(--border-light) !important;
        border-radius: 16px !important;
        padding: 14px 16px !important;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04) !important;
        box-sizing: border-box !important;
        width: 100% !important;
      }

      .maint-table tr td {
        display: block !important;
        padding: 0 !important;
        border: none !important;
        white-space: normal !important;
        min-width: 0 !important;
        max-width: none !important;
      }

      .maint-table tr td.col-ticket {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
      }

      .maint-table tr td.col-status {
        display: flex !important;
        justify-content: flex-end !important;
        margin-top: -36px !important;
      }

      .maint-table tr td.col-date,
      .maint-table tr td.col-room,
      .maint-table tr td.col-pc {
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px !important;
        margin-right: 12px !important;
        font-size: 12.5px !important;
      }

      .maint-table tr td.col-issues {
        margin-top: 2px !important;
      }

      .maint-table tr td.col-actions {
        margin-top: 4px;
        padding-top: 10px !important;
        border-top: 1px dashed var(--border-light) !important;
      }

      .maint-table tr td.col-actions .btn-resolve-ticket,
      .maint-table tr td.col-actions .completed-chip {
        width: 100% !important;
        justify-content: center !important;
        padding: 10px 14px !important;
        font-size: 13px !important;
        border-radius: 12px !important;
        box-sizing: border-box !important;
      }

      .mobile-card-meta {
        display: flex !important;
        align-items: center;
        gap: 5px 8px;
        flex-wrap: wrap;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 8px;
        background: #F8FAFC;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--border-light);
        box-sizing: border-box;
        width: 100%;
      }

      .mobile-card-meta>span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
    }

    .maint-controls-row {
      position: sticky;
      top: 0;
      background: transparent !important;
      z-index: 25;
      padding-top: 0;
      padding-bottom: 4px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-direction: row;
      gap: 16px;
    }

    .filter-pills-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      margin-bottom: 0;
    }

    .maint-search-wrap {
      display: flex;
      align-items: center;
      margin-top: 0;
    }

    /* Table Enhancements */
    .maint-table-wrapper {
      background: #FFFFFF;
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      overflow-y: auto !important;
      overflow-x: hidden !important;
      flex: 1 1 auto !important;
      min-height: 250px;
      max-height: none !important;
      -webkit-overflow-scrolling: touch;
      width: 100% !important;
      box-sizing: border-box;
    }

    .maint-table {
      table-layout: fixed !important;
      width: 100% !important;
      border-collapse: collapse;
    }

    .maint-table th.col-ticket, .maint-table td.col-ticket { width: 11% !important; }
    .maint-table th.col-date, .maint-table td.col-date { width: 12% !important; }
    .maint-table th.col-room, .maint-table td.col-room { width: 10% !important; }
    .maint-table th.col-pc, .maint-table td.col-pc { width: 8% !important; }
    .maint-table th.col-reporter, .maint-table td.col-reporter { width: 17% !important; overflow: hidden; }
    .maint-table th.col-issues, .maint-table td.col-issues { width: 28% !important; }
    .maint-table th.col-actions, .maint-table td.col-actions { width: 14% !important; text-align: center !important; }

    .maint-table-wrapper::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .maint-table-wrapper::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 99px;
    }

    .maint-table-wrapper::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 99px;
    }

    .maint-table-wrapper::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    .maint-table thead {
      position: sticky;
      top: -1px;
      z-index: 12;
    }

    .maint-table th {
      padding: 12px 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border-light, #E2E8F0);
      box-shadow: none;
      position: sticky;
      top: -1px;
      z-index: 10;
      white-space: nowrap;
    }

    .maint-table td {
      padding: 14px 10px;
      vertical-align: middle;
      border-bottom: 1px solid #F1F5F9;
      font-size: 13.5px;
    }

    .maint-table tr:last-child td {
      border-bottom: none;
    }

    .maint-table tr {
      transition: background 0.15s ease;
    }

    .maint-table tr:hover {
      background: #FAFDFE;
    }

    /* Ticket ID Badge */
    .ticket-chip,
    .ticket-id-tag {
      font-weight: 700;
      font-family: var(--font-display);
      color: #0284C7;
      background: #E0F2FE;
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1.5px solid #BAE6FD;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13.5px;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ticket-chip:hover,
    .ticket-id-tag:hover {
      background: #0284C7;
      color: #FFFFFF;
      border-color: #0284C7;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
    }

    .btn-others-count:hover {
      background: var(--primary-teal) !important;
      color: #FFFFFF !important;
      border-color: var(--primary-teal) !important;
      box-shadow: 0 4px 12px rgba(30, 187, 215, 0.3) !important;
    }

    /* Modern Interactive Reporter Chip */
    .reporter-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: #F1F5F9;
      border: 1.5px solid #CBD5E1;
      color: #0F172A;
      font-weight: 700;
      font-size: 13px;
      user-select: none;
      white-space: nowrap;
      max-width: 100%;
      box-sizing: border-box;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reporter-chip.multi {
      cursor: pointer;
    }

    .reporter-chip.single {
      cursor: default !important;
    }

    .reporter-chip .reporter-chip-name {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-dark);
      letter-spacing: 0.1px;
      display: inline-block;
      max-width: 125px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .reporter-chip .reporter-count-badge {
      font-size: 11px;
      font-weight: 800;
      background: rgba(30, 187, 215, 0.18);
      color: var(--primary-teal);
      padding: 2px 7px;
      border-radius: 9999px;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .reporter-chip .reporter-chip-arrow {
      transition: transform 0.2s ease, color 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    .reporter-chip.multi:hover {
      background: #E0F2FE;
      border-color: #38BDF8;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.22);
      transform: translateY(-1px);
    }

    .reporter-chip.multi:hover .reporter-chip-arrow {
      transform: translateX(3px);
      color: #0284C7 !important;
      opacity: 1 !important;
    }

    /* Dark Mode Overrides for Reporter Chip */
    html.dark-mode .reporter-chip,
    body.dark-mode .reporter-chip,
    [data-theme="dark"] .reporter-chip,
    html.high-contrast .reporter-chip {
      background: rgba(15, 23, 42, 0.6) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
      color: #F1F5F9 !important;
    }

    html.dark-mode .reporter-chip.multi:hover,
    body.dark-mode .reporter-chip.multi:hover,
    [data-theme="dark"] .reporter-chip.multi:hover,
    html.high-contrast .reporter-chip.multi:hover {
      background: rgba(6, 182, 212, 0.15) !important;
      border-color: #38BDF8 !important;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25) !important;
    }

    /* Component Tags */
    .issue-tag {
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .issue-tag.bad {
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
    }

    .issue-tag.ok {
      background: #F1F5F9;
      color: #64748B;
    }

    /* Remarks Quote Box */
    .remarks-quote-box {
      font-size: 13.5px;
      color: #0F172A;
      border-radius: 10px;
      line-height: 1.4;
      display: flex !important;
      align-items: center !important;
      gap: 7px !important;
      margin-top: 6px;
      box-sizing: border-box;
      max-width: 100%;
    }

    .remarks-quote-box .remarks-icon {
      color: var(--primary-teal, #1EBBD7) !important;
      flex-shrink: 0 !important;
      width: 14px !important;
      height: 14px !important;
    }

    .remarks-quote-box.static {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      padding: 6px 11px;
      color: #64748B;
      cursor: default !important;
      user-select: text;
    }

    .remarks-quote-box.static .remarks-text.static-text {
      font-weight: 500;
      color: #334155;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remarks-quote-box.static.empty-remarks {
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      opacity: 0.85;
    }

    .remarks-quote-box.interactive {
      background: #F0F9FF;
      border: 1.5px solid #BAE6FD;
      padding: 6px 11px;
      cursor: pointer !important;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      justify-content: space-between;
    }

    .remarks-quote-box.interactive:hover {
      background: #E0F2FE;
      border-color: #38BDF8;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.18);
      transform: translateY(-1px);
    }

    .remarks-main-content {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .remarks-quote-box .remarks-text.clamped {
      font-weight: 500;
      color: var(--text-dark, #0F172A);
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      line-height: 1.4;
    }

    .remarks-expand-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #0284C7;
      background: #E0F2FE;
      border: 1px solid #BAE6FD;
      padding: 3px 8px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 8px;
      transition: all 0.2s ease;
    }

    .remarks-expand-badge i,
    .remarks-expand-badge svg {
      transition: transform 0.2s ease;
      stroke-width: 2.5;
    }

    .remarks-quote-box.interactive:hover .remarks-expand-badge {
      background: #0284C7;
      color: #FFFFFF;
      border-color: #0284C7;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }

    .remarks-quote-box.interactive:hover .remarks-expand-badge i,
    .remarks-quote-box.interactive:hover .remarks-expand-badge svg {
      transform: translateX(2px);
    }

    /* Dark Mode Support for Remarks */
    html.dark-mode .remarks-quote-box.static,
    body.dark-mode .remarks-quote-box.static,
    [data-theme="dark"] .remarks-quote-box.static,
    html.high-contrast .remarks-quote-box.static {
      background: rgba(15, 23, 42, 0.4) !important;
      border-color: rgba(255, 255, 255, 0.08) !important;
      color: #94A3B8 !important;
    }

    html.dark-mode .remarks-quote-box.static .remarks-text.static-text,
    body.dark-mode .remarks-quote-box.static .remarks-text.static-text,
    [data-theme="dark"] .remarks-quote-box.static .remarks-text.static-text {
      color: #CBD5E1 !important;
    }

    html.dark-mode .remarks-quote-box.interactive,
    body.dark-mode .remarks-quote-box.interactive,
    [data-theme="dark"] .remarks-quote-box.interactive,
    html.high-contrast .remarks-quote-box.interactive {
      background: rgba(15, 23, 42, 0.6) !important;
      border-color: rgba(56, 189, 248, 0.3) !important;
      color: #F1F5F9 !important;
    }

    html.dark-mode .remarks-quote-box.interactive:hover,
    body.dark-mode .remarks-quote-box.interactive:hover,
    [data-theme="dark"] .remarks-quote-box.interactive:hover,
    html.high-contrast .remarks-quote-box.interactive:hover {
      background: rgba(6, 182, 212, 0.18) !important;
      border-color: #38BDF8 !important;
      box-shadow: 0 3px 10px rgba(56, 189, 248, 0.22) !important;
    }

    html.dark-mode .remarks-expand-badge,
    body.dark-mode .remarks-expand-badge,
    [data-theme="dark"] .remarks-expand-badge,
    html.high-contrast .remarks-expand-badge {
      background: rgba(2, 132, 199, 0.25) !important;
      color: #38BDF8 !important;
      border-color: rgba(56, 189, 248, 0.4) !important;
    }

    /* Status Badges with Pulse Dot */
    .status-badge-pulse {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 99px;
    }

    .status-badge-pulse.pending {
      background: #FEF3C7;
      color: #D97706;
      border: 1px solid #FDE68A;
    }

    .status-badge-pulse.resolved {
      background: #D1FAE5;
      color: #059669;
      border: 1px solid #A7F3D0;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-badge-pulse.pending .pulse-dot {
      background: #F59E0B;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
    }

    .status-badge-pulse.resolved .pulse-dot {
      background: #10B981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }

    /* Action Buttons */
    .btn-resolve-ticket {
      border: none;
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .btn-resolve-ticket:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
      background: linear-gradient(135deg, #059669, #047857);
    }

    .btn-resolve-ticket:active {
      transform: translateY(0);
    }

    .completed-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--badge-completed-text, #047857) !important;
      background: var(--badge-completed-bg, #ECFDF5);
      padding: 7px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--badge-completed-border, #A7F3D0);
      white-space: nowrap;
    }

    .completed-chip svg,
    .completed-chip i {
      width: 16px !important;
      height: 16px !important;
      stroke-width: 2.5 !important;
      flex-shrink: 0 !important;
      display: inline-block !important;
    }

    /* Read More Expand Button */
    .btn-read-more {
      background: none;
      border: none;
      color: var(--primary-teal);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 0 0 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: var(--font-body);
    }

    .btn-read-more:hover {
      text-decoration: underline;
    }

    /* High Contrast / Dark Mode Overrides */
    html.high-contrast .maint-table-wrapper,
    html.dark-mode .maint-table-wrapper,
    body.dark-mode .maint-table-wrapper,
    [data-theme="dark"] .maint-table-wrapper {
      background: #0F172A !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2) !important;
    }

    html.high-contrast .maint-table th,
    html.dark-mode .maint-table th,
    body.dark-mode .maint-table th,
    [data-theme="dark"] .maint-table th {
      background: #161F30 !important;
      color: #94A3B8 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: none !important;
    }

    html.high-contrast .maint-table td {
      border-bottom-color: var(--border-light) !important;
      color: var(--text-dark) !important;
    }

    html.high-contrast .maint-table tr:hover {
      background: rgba(30, 187, 215, 0.08) !important;
    }

    html.dark-mode .ticket-chip,
    body.dark-mode .ticket-chip,
    [data-theme="dark"] .ticket-chip,
    html.high-contrast .ticket-chip,
    html.dark-mode .ticket-id-tag,
    body.dark-mode .ticket-id-tag,
    [data-theme="dark"] .ticket-id-tag,

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">

    <!-- HEADER -->
    <header class="header">

      <!-- Logos -->
      <div class="header-logos" style="display: flex; align-items: center; gap: 14px;">
        <img src="assets/bsu-sarmiento-logo.png" alt="BSU Sarmiento Logo"
          style="height: 40px; width: auto; object-fit: contain;">
        <div class="logo-divider" style="width: 1px; height: 32px; background: var(--border-light);"></div>
        <img src="assets/labsync-logo.png" alt="LabSync Logo" style="height: 45px; width: auto; object-fit: contain;">
      </div>


      <!-- Right Profile -->
      <div class="header-right">
        <button class="notif-btn" title="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-bell">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
          </svg>
          <span class="notif-dot"></span>
        </button>

        <div class="profile-dropdown">
          <div class="avatar"></div>
          <div class="profile-info">
            <span class="profile-name"></span>
            <span class="profile-role"></span>
          </div>
          <button class="chevron-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-chevron-down">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
        </div>
        <script>
          (function () {
            try {
              var u = JSON.parse(sessionStorage.getItem("labsync_user") || "null");
              var hr = document.currentScript.parentElement;
              if (u && hr) {
                var n = hr.querySelector(".profile-name");
                var r = hr.querySelector(".profile-role");
                var a = hr.querySelector(".avatar");
                if (n && u.name) n.textContent = u.name;
                if (r && u.role) r.textContent = u.role;
                if (a) {
                  if (u.profilePhoto) a.innerHTML = "<img src=\"" + u.profilePhoto + "\" alt=\"Profile\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%;\">";
                  else if (u.name) a.textContent = u.name.split(" ").map(function (x) { return x[0]; }).join("").slice(0, 2).toUpperCase();
                }
              }
              var hasUnread = sessionStorage.getItem("labsync_has_unread_notifs") === "true";
              var d = hr ? hr.querySelector(".notif-dot") : null;
              if (d) d.style.display = hasUnread ? "block" : "none";
            } catch (e) { }
          })();
        </script>
      </div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content" style="overflow-y: auto;">

      <!-- Greeting + Clock Row -->
      <div class="greeting-row">
        <div class="greeting-left">
          <h1 class="greeting-title" id="greetingText">Maintenance Tracker</h1>
          <p class="greeting-sub" id="greetingSub">Monitor, process, and resolve computer laboratory maintenance
            tickets.</p>
        </div>
        <div class="clock-block">
          <div class="clock-time" id="clockTime"></div>
          <div class="clock-date" id="clockDate"></div>
          <script>
            (function () {
              try {
                var d = new Date(), DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds(), ampm = h >= 12 ? 'PM' : 'AM', fh = h % 12 || 12;
                var p = function (n) { return String(n).padStart(2, '0'); };
                var t = document.getElementById('clockTime'), dt = document.getElementById('clockDate');
                if (t) t.textContent = p(fh) + ':' + p(m) + ':' + p(s) + ' ' + ampm;
                if (dt) dt.textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
              } catch (e) { }
            })();
          </script>
        </div>
      </div>

      <!-- Main Content Card -->
      <div class="dashboard-card"
        style="padding: 16px 20px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0;">

        <!-- Controls Row -->
        <div class="maint-controls-row">

          <!-- Filter Pills -->
          <div class="filter-pills-row">
            <button type="button" class="filter-pill active" id="filter-all">
              <i data-lucide="layers" style="width: 16px; height: 16px;"></i> All Tickets
            </button>
            <button type="button" class="filter-pill" id="filter-pending">
              <i data-lucide="alert-circle" style="width: 16px; height: 16px;"></i> Pending
            </button>
            <button type="button" class="filter-pill" id="filter-resolved">
              <i data-lucide="check-circle-2" style="width: 16px; height: 16px;"></i> Resolved
            </button>
          </div>

          <!-- Right Search Input -->
          <div class="maint-search-wrap">
            <div class="search-box" style="position: relative; width: 360px;">
              <i data-lucide="search"
                style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #94A3B8;"></i>
              <input type="text" id="maintenanceSearchInput" placeholder="Search by Ticket ID, Room, PC, or Details..."
                style="width: 100%; padding: 11px 16px 11px 42px; border: 1.5px solid var(--border-light); border-radius: 12px; font-size: 14px; outline: none; font-family: var(--font-body); transition: border-color 0.2s;"
                onfocus="this.style.borderColor='var(--primary-teal)'"
                onblur="this.style.borderColor='var(--border-light)'">
            </div>
          </div>
        </div>

        <!-- Table Container -->
        <div class="maint-table-wrapper" style="overflow-x: hidden; flex: 1; min-height: 250px; width: 100%;">
          <table class="maint-table" style="width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed;">
            <colgroup>
              <col style="width: 11%;">
              <col style="width: 12%;">
              <col style="width: 10%;">
              <col style="width: 8%;">
              <col style="width: 17%;">
              <col style="width: 28%;">
              <col style="width: 14%;">
            </colgroup>
            <thead>
              <tr>
                <th class="col-ticket" style="width: 11%;">Ticket ID</th>
                <th class="col-date" style="width: 12%;">Date & Time</th>
                <th class="col-room" style="width: 10%;">Lab Room</th>
                <th class="col-pc" style="width: 8%;">PC Unit</th>
                <th class="col-reporter" style="width: 17%;">Reported By</th>
                <th class="col-issues" style="width: 28%;">Issue Details & Remarks</th>
                <th class="col-actions" style="width: 14%; text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="dynamicMaintenanceRows">
              <tr>
                <td colspan="7" style="padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px;">
                  Loading maintenance tickets...
                </td>
              </tr>
              <script>
                (function () {
                  try {
                    var tbody = document.getElementById('dynamicMaintenanceRows');
                    var cached = JSON.parse(sessionStorage.getItem('labsync_cached_reports') || 'null');
                    if (Array.isArray(cached) && cached.length > 0 && tbody && window.maintenanceRenderer && typeof window.maintenanceRenderer.renderTableRows === 'function') {
                      window.maintenanceRenderer.renderTableRows(cached, tbody);
                    }
                  } catch (e) { }
                })();
              </script>
            </tbody>
          </table>
        </div>

      </div>
    </main>
